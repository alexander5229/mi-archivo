
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar aprendiz</title>
</head>
<body>

    <h1>Eliminar aprendiz</h1>

    <p>
        ¿Estás seguro de que deseas eliminar a
        {{ aprendiz.nombre }} {{ aprendiz.apellido }}?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Sí, eliminar</button>
    </form>

    <a href="{% url 'lista_aprendices' %}">
        Cancelar
    </a>

</body>
</html>
