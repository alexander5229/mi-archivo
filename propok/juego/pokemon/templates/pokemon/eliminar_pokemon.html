```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar Pokémon</title>
</head>

<body>

    <h1>Eliminar Pokémon</h1>

    <p>
        ¿Estás seguro de que deseas eliminar
        el Pokémon <strong>{{ pokemon.nombre }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

    <br>

    <a href="{% url 'listar_pokemones' %}">
        Cancelar
    </a>

</body>

</html>
