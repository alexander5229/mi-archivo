
{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Entrenador | ProPok</title>

    <link rel="stylesheet" href="{% static 'pokemon/css/estilos.css' %}">
</head>

<body>

    <header class="encabezado">
        <h1>ProPok</h1>
        <p>Registro de entrenadores Pokémon</p>
    </header>

    <main class="contenedor">

        <h2>Registrar nuevo entrenador</h2>

        <p class="introduccion">
            Completa los siguientes datos para registrar un entrenador.
        </p>

        <form method="POST" enctype="multipart/form-data" class="formulario">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="boton">
                Guardar entrenador
            </button>

            <a href="{% url 'listar_entrenadores' %}" class="boton boton-secundario">
                Cancelar
            </a>

        </form>

    </main>

    <footer>
        <p>ProPok © 2026 - Sistema de administración Pokémon</p>
    </footer>

</body>
</html>
