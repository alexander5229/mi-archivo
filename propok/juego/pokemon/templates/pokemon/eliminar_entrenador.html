
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ProPok - Eliminar</title>
</head>
<body>

    <h1>Eliminar Entrenador</h1>

    <p>
        ¿Deseas eliminar al entrenador
        {{ entrenador.nombre }}
        {{ entrenador.apellido }}?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirmar eliminación
        </button>

    </form>

    <a href="{% url 'listar_entrenadores' %}">
        Cancelar
    </a>

</body>
</html>
